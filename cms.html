const ACCOUNT_KEY='thw_cms_demo_accounts_v1';
const ROLE_NAMES={admin:'系統管理員',publisher:'內容編輯與發布管理者',viewer:'唯讀檢視者'};

let accountRolesMigrated=false;for(const a of accounts){if(a.role==='editor'){a.role='publisher';accountRolesMigrated=true}}if(accountRolesMigrated){try{localStorage.setItem(ACCOUNT_KEY,JSON.stringify(accounts))}catch(e){}}
let activeAccountId='owner';
function activeAccount(){return accounts.find(a=>a.id===activeAccountId&&a.active)||accounts.find(a=>a.active&&a.role==='admin')||accounts[0]}
function can(action){const role=activeAccount()?.role||'viewer';if(role==='admin')return true;if(action==='view')return true;if(role==='publisher')return ['edit','publish','delete','export'].includes(action);return false}
function canView(k){if(k==='users')return can('users');if(k==='settings')return can('settings');if(k==='backup')return can('export');return true}
function requirePermission(action){if(can(action))return true;toast('權限不足：'+(ROLE_NAMES[activeAccount()?.role]||'目前角色')+'無法執行此操作','error');return false}
function saveAccounts(){try{localStorage.setItem(ACCOUNT_KEY,JSON.stringify(accounts));return true}catch(e){toast('帳號設定儲存失敗','error');return false}}
function accountBar(){const e=document.getElementById('accountBar');if(!e)return;e.innerHTML=`<label style="font-size:12px">模擬登入身分　<select aria-label="切換示範帳號" onchange="switchAccount(this.value)" style="padding:7px;border:1px solid #cddbd0;border-radius:8px;background:#fff">${accounts.filter(a=>a.active).map(a=>`<option value="${esc(a.id)}" ${a.id===activeAccount().id?'selected':''}>${esc(a.name)}｜${ROLE_NAMES[a.role]}</option>`).join('')}</select></label>`}
function switchAccount(accountId){if(!accounts.some(a=>a.id===accountId&&a.active))return;activeAccountId=accountId;if(!canView(current))current='dashboard';nav();document.getElementById('topTitle').textContent=labels[current];render();toast('已切換為 '+activeAccount().name+'（本機權限模擬）')}
function usersPage(){if(!requirePermission('users'))return;const rows=accounts.map(a=>`<tr><td>${esc(a.name)}</td><td>${esc(a.email)}</td><td>${ROLE_NAMES[a.role]}</td><td>${a.active?'啟用':'停用'}</td><td><button class="mini" onclick="editAccount('${esc(a.id)}')">編輯</button></td></tr>`).join('');document.getElementById('app').innerHTML=heading('帳號權限管理','建立帳號資料、設定角色與啟用狀態；正式版需串接安全登入服務。',`<button class="btn primary" onclick="editAccount()">＋ 新增帳號</button>`)+`<div class="note"><strong>展示模式提醒：</strong>這是單機角色權限流程模擬，切換帳號不需要密碼，不能作為正式網站的安全防護。正式版需後端登入驗證、密碼雜湊／SSO、伺服器端權限檢查、稽核紀錄。</div><div class="card pad"><h2 class="sectiontitle">後台帳號</h2><div style="overflow-x:auto"><table style="width:100%;text-align:left;border-collapse:collapse"><thead><tr><th>姓名</th><th>Email／帳號</th><th>角色</th><th>狀態</th><th>操作</th></tr></thead><tbody>${rows}</tbody></table></div></div><div class="card pad" style="margin-top:16px"><h2 class="sectiontitle">角色權限說明</h2>${Object.keys(ROLE_NAMES).map(k=>`<p><strong>${ROLE_NAMES[k]}</strong>：${ROLE_HELP[k]}</p>`).join('')}</div>`}
function editAccount(accountId){if(!requirePermission('users'))return;const a=accounts.find(x=>x.id===accountId)||{id:'',name:'',email:'',role:'publisher',active:true};const name=prompt('帳號顯示名稱：',a.name);if(name===null)return;if(!name.trim())return toast('名稱不能空白','error');const email=prompt('登入 Email（僅供示範，尚未啟用驗證）：',a.email);if(email===null)return;if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.trim()))return toast('請輸入有效 Email','error');if(accounts.some(x=>x.email.toLowerCase()===email.trim().toLowerCase()&&x.id!==a.id))return toast('Email 已存在','error');const role=prompt('角色代碼：admin（系統管理員）／publisher（內容編輯與發布）／viewer（唯讀檢視）',a.role);if(role===null)return;if(!ROLE_NAMES[role])return toast('角色代碼不正確','error');const active=confirm('是否啟用此帳號？\n按「確定」啟用；按「取消」停用。');if(a.id===activeAccountId&&(!active||role!=='admin'))return toast('不可停用目前使用中的管理員，或移除自己的管理權限','error');if(a.id){const old=accounts.find(x=>x.id===a.id);Object.assign(old,{name:name.trim(),email:email.trim(),role,active})}else accounts.push({id:'u'+Date.now(),name:name.trim(),email:email.trim(),role,active});if(!accounts.some(x=>x.active&&x.role==='admin'))return toast('至少需要一名啟用中的管理員','error');if(saveAccounts()){usersPage();accountBar();toast('帳號設定已儲存（僅供本機展示）')}}
function nav(){ accountBar();$('#nav').innerHTML=Object.keys(labels).filter(k=>k!=='users'||can('users')).map(k=>`<button class="${current===k?'active':''}" onclick="go('${k}')">${symbols[k]}　${labels[k]}</button>`).join('') }function go(k){if(!canView(k)){toast('目前角色沒有此頁面權限','error');return}current=k;query='';statusFilter='all';nav();$('#topTitle').textContent=labels[k];render();window.scrollTo(0,0)}
function heading(title,sub,extra=''){return `<div class="heading"><div><h1>${title}</h1><p>${sub}</p></div>${extra}</div>`}
function render(){if(current==='dashboard')dashboard();else if(['banners','news','menu','stores','pages'].includes(current))listing();else if(current==='settings')settings();else if(current==='users')usersPage();else backup()}
function dashboard(){let keys=['banners','news','menu','stores'];$('#app').innerHTML=heading('網站內容總覽','集中管理添好運台灣官網的主要內容。')+`<div class="note">此為可操作的 CMS Demo：編輯內容只會儲存在此瀏覽器，不會同步到目前的前台 HTML 或公開網站。請定期至「資料備份」匯出 JSON。</div><div class="stats">${keys.map(k=>`<div class="card stat"><small>${labels[k]}</small><strong>${db[k].length}</strong><small>已發布 ${db[k].filter(x=>x.published).length} 筆</small></div>`).join('')}</div><div class="two"><div class="card pad"><h2 class="sectiontitle">快速開始</h2><p class="help">選擇左側功能即可編輯內容。最新消息支援所見即所得圖文編輯；菜單與門市可以新增、排序、上傳圖片與切換發布狀態。</p><div class="toolbar"><button class="btn primary" onclick="go('news')">新增最新消息</button><button class="btn" onclick="go('menu')">管理美味菜單</button><button class="btn" onclick="go('stores')">管理門市</button></div></div><div class="card pad"><h2 class="sectiontitle">發布流程（展示）</h2><p class="help">① 編輯內容 → ② 預覽 → ③ 儲存 → ④ 切換已發布 → ⑤ 匯出 JSON。</p><p class="help">正式版才會提供帳號權限、伺服器儲存、前台 API 同步及客服信箱串接。</p></div></div>`}
function listing(){let k=current,items=db[k].filter(x=>[x.title,x.category,x.region,x.subtitle,x.description,x.date,x.address].some(v=>String(v||'').toLowerCase().includes(query.trim().toLowerCase()))&&(statusFilter==='all'||(statusFilter==='on'?x.published:!x.published))).sort((a,b)=>(+a.order||0)-(+b.order||0));let frontBannerIds=new Set(k==='banners'?db.banners.filter(x=>x.published).sort((a,b)=>(+a.order||0)-(+b.order||0)).slice(0,6).map(x=>x.id):[]);let add=k==='pages'?'':`<button class="btn primary" onclick="edit('${k}')">＋ 新增${({banners:'Banner',news:'文章',menu:'餐點',stores:'門市'})[k]}</button>`;$('#app').innerHTML=heading(labels[k],({banners:'可不限筆數新增；前台最多顯示排序前 6 筆已發布 Banner',news:'使用圖文編輯器管理文章、日期及發布狀態',menu:'管理餐點分類、介紹及圖片',stores:'管理門市資訊與橫式代表圖',pages:'管理頁面文案、圖片及發布狀態'})[k],add)+`<div class="card pad"><div class="filter"><input aria-label="搜尋" placeholder="搜尋名稱／標題" value="${esc(query)}" oncompositionstart="searchComposing=true" oncompositionend="searchComposing=false" onkeydown="if(event.key==='Enter' && !event.isComposing && !searchComposing && event.keyCode!==229){event.preventDefault();updateListSearch(this.value)}"><button type="button" class="mini" onclick="updateListSearch(document.querySelector('.filter input[aria-label=&quot;搜尋&quot;]').value)">搜尋</button><select aria-label="狀態" onchange="statusFilter=this.value;listing()"><option value="all" ${statusFilter==='all'?'selected':''}>全部狀態</option><option value="on" ${statusFilter==='on'?'selected':''}>已發布</option><option value="off" ${statusFilter==='off'?'selected':''}>未發布</option></select><span class="muted">共 ${items.length} 筆${k==='banners'?`｜目前前台預計顯示 ${db.banners.filter(x=>x.published).length>6?6:db.banners.filter(x=>x.published).length} / 6 則（依排序）`:''}</span></div><div class="tablewrap"><table><thead><tr><th>圖片</th><th>標題／名稱</th><th>分類／資訊</th><th>排序</th><th>狀態</th><th>操作</th></tr></thead><tbody>${items.map(x=>`<tr><td>${imageTag(x.image)}</td><td><b>${esc(x.title)}</b>${x.date?`<div class="muted">${esc(x.date)}</div>`:''}</td><td>${esc(x.category||x.region||x.subtitle||'—')}</td><td>${x.order??'—'}</td><td><button class="mini" onclick="toggle('${k}',${x.id})"><span class="pill ${x.published?'':'off'}">${x.published?(k==='banners'&&!frontBannerIds.has(x.id)?'已發布・候補':'已發布'):'未發布'}</span></button></td><td><button class="mini" onclick="edit('${k}',${x.id})">編輯</button>${k!=='pages'?`<button class="mini danger" onclick="removeItem('${k}',${x.id})">刪除</button>`:''}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">沒有符合條件的資料</td></tr>'}</tbody></table></div></div>`}
let searchComposing=false;
function updateListSearch(value){
  if(searchComposing)return;
  query=value;
  const input=document.querySelector('.filter input[aria-label="搜尋"]');
  const start=input?.selectionStart,end=input?.selectionEnd;
  listing();
  const next=document.querySelector('.filter input[aria-label="搜尋"]');
  if(next){next.focus();try{next.setSelectionRange(start,end)}catch(e){}}

function saveEdit(ev,k,wasExisting,itemid){ev.preventDefault();if(!requirePermission('edit'))return;if(k==='news'||k==='pages'){beCollect();beSync();}if(cropSource&&!workingImage){alert('請先按「套用裁切」，再儲存。');return}if(cropSource&&!confirm('圖片裁切已確認？若尚未按「套用裁切」，將使用前一次儲存的圖片。'))return;let obj=wasExisting?db[k].find(x=>x.id===itemid):{id:itemid};schemas[k].forEach(([name,,type])=>{let v=$('#f_'+name).value;obj[name]=type==='number'?Number(v):v});if(k==='banners')delete obj.link;obj.image=workingImage;obj.published=document.querySelector('input[name="visibility"]:checked')?.value==='published';if(!can('publish'))obj.published=wasExisting?db[k].find(x=>x.id===itemid).published:false;if(['news','pages'].includes(k))obj.body=$('#rich').innerHTML;if(!wasExisting)db[k].push(obj);if(save()){closeModal();listing();toast('儲存成功！變更已保存在此瀏覽器。');window.alert('✓ 儲存成功！\n資料已儲存在目前瀏覽器中。')}else{toast('儲存失敗，請調整後重試。','error');window.alert('✕ 儲存失敗！\n請檢查瀏覽器儲存空間或縮小圖片後重試。')}}
function settings(){let s=db.settings;$('#app').innerHTML=heading('網站設定','網站 SEO 與廣告追蹤碼管理。')+`<div class="note">追蹤碼可在此編輯、儲存並匯出套用後的前台 HTML。<strong>本機 Demo 無法直接發布到正式網站</strong>；正式版需要工程師提供後端發布 API、權限控管與版本回復。</div><div class="card pad"><form onsubmit="saveSettings(event)"><h2 class="sectiontitle">網站基本設定與 SEO</h2><div class="gridform">${[['siteName','網站名稱'],['seoTitle','SEO 網頁標題'],['seoDescription','SEO 網頁描述']].map(([k,l])=>`<div class="field ${['seoDescription'].includes(k)?'full':''}"><label>${l}</label><input id="setting_${k}" value="${esc(s[k])}"></div>`).join('')}</div><h2 class="sectiontitle" style="margin-top:30px">廣告與分析追蹤碼管理</h2><p class="help">請貼上平台提供的<strong>完整原始碼</strong>，不要只填 ID。Google tag (gtag.js) 通常放在 &lt;head&gt;；GTM 的 script 放在 &lt;head&gt;，noscript 緊接 &lt;body&gt; 開始處；Meta Pixel 基礎碼放在 &lt;head&gt;，其 noscript 圖片也保留在 head 區塊。避免同一組 Pixel / GA4 同時經 GTM 與直接埋碼重複觸發。</p>${[['gtmHead','Google Tag Manager｜Head 程式碼','貼上 GTM 的 script 程式碼'],['gtmBody','Google Tag Manager｜Body 程式碼','貼上 GTM 的 <noscript>...</noscript>'],['googleHead','Google Analytics／Google Ads｜Head 程式碼','貼上 gtag.js 的完整程式碼'],['metaHead','Meta Pixel｜Head 程式碼','貼上 Meta Pixel 基礎碼（含 script / noscript）'],['customHead','其他追蹤碼｜Head','僅限受信任的追蹤服務'],['customBody','其他追蹤碼｜Body 起始處','僅限受信任的追蹤服務']].map(([k,label,hint])=>`<div class="field" style="margin:16px 0"><label for="tracking_${k}">${label}</label><textarea id="tracking_${k}" spellcheck="false" rows="5" style="width:100%;font-family:Consolas,monospace;font-size:13px;white-space:pre;tab-size:2" placeholder="${esc(hint)}">${esc(s.tracking?.[k]||'')}</textarea></div>`).join('')}<div class="actions"><span class="muted">儲存不會在 CMS 後台執行追蹤碼。</span><button class="btn primary" type="submit">儲存追蹤設定</button></div></form></div><div class="card pad" style="margin-top:18px"><h2 class="sectiontitle">產生已埋碼的前台 HTML</h2><p class="help">選擇目前的前台 HTML，系統會把追蹤碼插入正確位置並下載新檔；<strong>不會自動上傳至正式官網</strong>。請先儲存上方設定。正式部署需由工程師將檔案上傳主機，或串接 CMS 發布 API。</p><input type="file" id="tracking_front_file" accept=".html,text/html"><div class="actions"><button class="btn primary" type="button" onclick="exportTrackedFrontend()">產生前台追蹤碼版 HTML</button><button class="btn" type="button" onclick="downloadTrackingManifest()">下載追蹤設定 JSON（交付工程師）</button></div><p class="help">安全提醒：貼入的 JavaScript 將在正式前台執行。只允許有權限的管理員修改，正式版應設審核、操作紀錄、CSP 與同意管理機制。</p></div>`}
function saveSettings(ev){ev.preventDefault();if(!requirePermission('settings'))return;const next={...db.settings,tracking:{}};for(const k of ['siteName','seoTitle','seoDescription']){const f=$('#setting_'+k);if(f)next[k]=f.value.trim()};for(const k of TRACKING_KEYS)next.tracking[k]=$('#tracking_'+k)?.value||'';db.settings=next;if(save()){toast('追蹤碼設定已儲存（尚未發布至前台）');window.alert('✓ 儲存成功！追蹤碼尚未部署到正式網站。')}else{toast('設定儲存失敗','error');window.alert('✕ 儲存失敗，請確認瀏覽器空間。')}}
const TRACKING_KEYS=['gtmHead','gtmBody','googleHead','metaHead','customHead','customBody'];
function trackingPayload(){const t=db.settings.tracking||{};return {head:['gtmHead','googleHead','metaHead','customHead'].map(k=>t[k]||'').filter(Boolean).join('\n'),body:['gtmBody','customBody'].map(k=>t[k]||'').filter(Boolean).join('\n')}}
function downloadBlob(name,content,type){const blob=new Blob([content],{type});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function downloadTrackingManifest(){downloadBlob('TimHoWan_tracking_settings.json',JSON.stringify({version:1,tracking:db.settings.tracking||{},placement:{gtmHead:'head',gtmBody:'body-start',googleHead:'head',metaHead:'head',customHead:'head',customBody:'body-start'},note:'正式發布需要權限審核、同意管理及部署 API'},null,2),'application/json');toast('已匯出追蹤設定')}
function exportTrackedFrontend(){const input=$('#tracking_front_file');const file=input?.files?.[0];if(!file){toast('請先選擇前台 HTML 檔案','error');return}const reader=new FileReader();reader.onerror=()=>toast('無法讀取前台 HTML','error');reader.onload=()=>{let html=String(reader.result||'');if(!/<\/head\s*>/i.test(html)||!/<body\b[^>]*>/i.test(html)){toast('這不是有效的完整 HTML，缺少 head 或 body','error');return}const marks=['THW-TRACKING-HEAD','THW-TRACKING-BODY'];html=html.replace(/<!-- THW-TRACKING-HEAD:START -->[\s\S]*?<!-- THW-TRACKING-HEAD:END -->/g,'').replace(/<!-- THW-TRACKING-BODY:START -->[\s\S]*?<!-- THW-TRACKING-BODY:END -->/g,'');const parts=trackingPayload();const head='\n<!-- THW-TRACKING-HEAD:START -->\n'+parts.head+'\n<!-- THW-TRACKING-HEAD:END -->\n';const body='\n<!-- THW-TRACKING-BODY:START -->\n'+parts.body+'\n<!-- THW-TRACKING-BODY:END -->\n';html=html.replace(/<\/head\s*>/i,head+'<meta name="robots" content="noindex,nofollow"></head>').replace(/<body\b[^>]*>/i,m=>m+body);downloadBlob(file.name.replace(/\.html?$/i,'')+'_tracking.html',html,'text/html;charset=utf-8');toast('已產生前台 HTML（需部署後才會上線）')};reader.readAsText(file)}

function exportData(){if(!requirePermission('export'))return;let b=new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),data:db},null,2)],{type:'application/json'});let u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='TimHoWan_CMS_Backup_'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);toast('備份已下載')}
function importData(ev){if(!requirePermission('settings'))return;let f=ev.target.files?.[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let v=JSON.parse(r.result),d=v.data||v;if(!['banners','news','menu','stores','pages','settings'].every(k=>k in d)||!['banners','news','menu','stores','pages'].every(k=>Array.isArray(d[k])))throw Error('資料格式不正確');if(!confirm('確定以匯入資料覆蓋目前所有內容？'))return;db=d;if(save()){go('dashboard');toast('備份匯入完成')}}catch(e){alert('無法匯入：'+e.message)}};r.readAsText(f)}function resetData(){if(!requirePermission('settings'))return;if(confirm('確定清除所有修改並恢復初始 Demo 資料？')){db=structuredClone(defaults);if(save()){go('dashboard');toast('重設成功！')}else toast('重設失敗。','error')}}

let beBlocks=[],beHistory=[],beFuture=[],beTarget=null,bePreviewMode='desktop',beReady=false;
function beUid(){return 'b'+Math.random().toString(36).slice(2,10)}
function bePlain(t){let el=document.createElement('div');el.textContent=t||'';return el.innerHTML}
function beFromHtml(html){let root=document.createElement('div');root.innerHTML=html||'';let result=[];for(const node of [...root.childNodes]){if(node.nodeType===3){if(node.textContent.trim())result.push({id:beUid(),kind:'p',html:bePlain(node.textContent)});continue}if(node.nodeType!==1)continue;let tag=node.tagName.toLowerCase();if(tag==='img'){result.push({id:beUid(),kind:'image',src:node.getAttribute('src')||'',caption:''})}else if(node.classList.contains('be-columns')){let im=node.querySelector('img');result.push({id:beUid(),kind:'columns',src:im?.src||'',html:node.querySelector('.be-column-text')?.innerHTML||'<p>輸入文字</p>'})}else if(tag==='a'&&node.classList.contains('be-link')){result.push({id:beUid(),kind:'button',text:node.textContent,url:node.href})}else if(['h2','h3','p','ul','ol','blockquote'].includes(tag)){result.push({id:beUid(),kind:tag==='ul'||tag==='ol'?'list':tag==='blockquote'?'p':tag,html:node.innerHTML})}else{result.push({id:beUid(),kind:'p',html:node.innerHTML})}}return result.length?result:[{id:beUid(),kind:'p',html:''}]}
function beInit(){let rich=document.getElementById('rich'),host=document.getElementById('be-blocks');if(!rich||!host)return;beBlocks=beFromHtml(rich.innerHTML);beHistory=[];beFuture=[];beReady=true;beRender();beSync()}
function beSnapshot(){if(!beReady)return;beCollect();beHistory.push(JSON.stringify(beBlocks));if(beHistory.length>35)beHistory.shift();beFuture=[]}
function beCollect(){document.querySelectorAll('#be-blocks .be-block').forEach(el=>{let b=beBlocks.find(x=>x.id===el.dataset.id);if(!b)return;let edit=el.querySelector('[data-be-edit]');if(edit){if(b.kind==='button')b.text=edit.textContent;else b.html=edit.innerHTML}let list=el.querySelector('[data-be-list]');if(list)b.html=list.innerHTML;let cap=el.querySelector('[data-be-caption]');if(cap)b.caption=cap.textContent;let url=el.querySelector('[data-be-url]');if(url)b.url=url.value})}
function beHtml(){return beBlocks.map(b=>{let h=b.html||'';if(b.kind==='image')return `<figure><img src="${b.src||''}" alt="" style="max-width:100%;height:auto"><figcaption>${bePlain(b.caption||'')}</figcaption></figure>`;if(b.kind==='columns')return `<div class="be-columns ${b.imageSide==='right'?'be-reverse':''}"><img src="${b.src||''}" alt=""><div class="be-column-text">${h}</div></div>`;if(b.kind==='button')return `<a class="be-link" href="${bePlain(b.url||'#')}">${bePlain(b.text||'了解更多')}</a>`;if(b.kind==='list'){let tag=b.listStyle==='decimal'?'ol':'ul',style=['disc','circle','square','decimal','none'].includes(b.listStyle)?b.listStyle:'disc';return `<${tag} style="list-style-type:${style};padding-left:26px">${beListItems(h)}</${tag}>`};return `<${b.kind}>${h}</${b.kind}>`}).join('\n')}
function beSync(){let rich=document.getElementById('rich');if(!rich)return;rich.innerHTML=beHtml();let status=document.getElementById('be-status');if(status)status.textContent='編輯中・請按下方「儲存變更」';}
function beListItems(html){let temp=document.createElement('div');temp.innerHTML=html||'';let items=[...temp.querySelectorAll('li')];if(items.length)return items.map(x=>`<li>${x.innerHTML}</li>`).join('');let raw=temp.innerText||temp.textContent||'';return raw.split(/\n+/).filter(x=>x.trim()).map(x=>`<li>${bePlain(x)}</li>`).join('')||'<li></li>'}
function beSetListStyle(id,value){beCollect();beSnapshot();let b=beBlocks.find(x=>x.id===id);if(b)b.listStyle=value;beRender();beSync()}
function beFlipColumns(id){beCollect();beSnapshot();let b=beBlocks.find(x=>x.id===id);if(b)b.imageSide=b.imageSide==='right'?'left':'right';beRender();beSync()}
function beRender(){let host=document.getElementById('be-blocks');if(!host)return;host.innerHTML=beBlocks.map((b,i)=>{let action=`<div class="be-actions"><button type="button" title="往上" onclick="beMove('${b.id}',-1)">↑</button><button type="button" title="往下" onclick="beMove('${b.id}',1)">↓</button><button type="button" title="刪除" onclick="beRemove('${b.id}')">×</button></div>`;let inner='';if(['p','h2','h3'].includes(b.kind))inner=`<div class="be-edit" contenteditable="true" data-be-edit data-placeholder="點此輸入文字...">${b.html||''}</div>`;else if(b.kind==='list'){let style=b.listStyle||'disc';inner=`<label class="be-option">清單樣式 <select onchange="beSetListStyle('${b.id}',this.value)"><option value="disc" ${style==='disc'?'selected':''}>● 實心圓點</option><option value="circle" ${style==='circle'?'selected':''}>○ 空心圓點</option><option value="square" ${style==='square'?'selected':''}>■ 方形符號</option><option value="decimal" ${style==='decimal'?'selected':''}>1. 數字編號</option><option value="none" ${style==='none'?'selected':''}>無符號</option></select></label><${style==='decimal'?'ol':'ul'} class="be-list-edit" style="list-style-type:${style};" data-be-list>${beListItems(b.html||'')}</${style==='decimal'?'ol':'ul'}><div class="be-help">點擊清單項目直接修改；Enter 可新增下一項。</div>`;}else if(b.kind==='image')inner=`${b.src?`<img class="be-img" src="${b.src}">`:'<div class="be-placeholder">點擊上傳圖片</div>'}<button type="button" class="btn" onclick="beUpload('image','${b.id}')">替換圖片</button><div class="be-caption be-edit" contenteditable="true" data-be-caption data-placeholder="圖片說明（選填）">${bePlain(b.caption||'')}</div>`;else if(b.kind==='columns')inner=`<div class="be-column-tools"><button type="button" class="btn" onclick="beFlipColumns('${b.id}')">⇄ 切換圖片至${b.imageSide==='right'?'左':'右'}側</button><span class="muted">目前：圖片在${b.imageSide==='right'?'右':'左'}、文字在${b.imageSide==='right'?'左':'右'}</span></div><div class="be-columns ${b.imageSide==='right'?'be-reverse':''}"><div>${b.src?`<img class="be-img" src="${b.src}">`:'<div class="be-placeholder">尚未上傳圖片</div>'}<button type="button" class="btn" onclick="beUpload('columns','${b.id}')">上傳／替換圖片</button></div><div class="be-edit" contenteditable="true" data-be-edit data-placeholder="圖文內容">${b.html||''}</div></div>`;else if(b.kind==='button')inner=`<div class="be-edit" contenteditable="true" data-be-edit>${bePlain(b.text||'了解更多')}</div><label class="be-caption">按鈕網址 <input data-be-url type="url" value="${bePlain(b.url||'https://')}" placeholder="https://..."></label>`;return `<section class="be-block" data-id="${b.id}" data-kind="${b.kind}">${inner}${action}</section>`}).join('');host.querySelectorAll('[data-be-list]').forEach(el=>{el.querySelectorAll('li').forEach(li=>li.setAttribute('contenteditable','true'));el.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();let li=e.target.closest('li');if(!li)return;let next=document.createElement('li');next.setAttribute('contenteditable','true');next.innerHTML='<br>';li.after(next);next.focus();beCollect();beSync()}else if(e.key==='Backspace'&&e.target.closest('li')?.textContent.trim()===''&&el.children.length>1){e.preventDefault();let li=e.target.closest('li'),prev=li.previousElementSibling||li.nextElementSibling;li.remove();prev?.focus();beCollect();beSync()}})});host.querySelectorAll('[contenteditable], [data-be-url]').forEach(el=>{el.addEventListener('input',()=>{beCollect();beSync()});el.addEventListener('focus',()=>{beHistory.push(JSON.stringify(beBlocks));if(beHistory.length>35)beHistory.shift()})});}
function beAdd(kind){beSnapshot();let b={id:beUid(),kind,html:'',src:'',caption:'',text:'了解更多',url:'https://',listStyle:'disc',imageSide:'left'};beBlocks.push(b);beRender();beSync();let last=document.querySelector('#be-blocks .be-block:last-child [contenteditable]');last?.focus()}
function beMove(id,d){beSnapshot();let i=beBlocks.findIndex(x=>x.id===id),j=i+d;if(j<0||j>=beBlocks.length)return;[beBlocks[i],beBlocks[j]]=[beBlocks[j],beBlocks[i]];beRender();beSync()}
function beRemove(id){beSnapshot();beBlocks=beBlocks.filter(x=>x.id!==id);beRender();beSync()}
function beUndo(){if(!beHistory.length)return;beCollect();beFuture.push(JSON.stringify(beBlocks));beBlocks=JSON.parse(beHistory.pop());beRender();beSync()}
function beRedo(){if(!beFuture.length)return;beCollect();beHistory.push(JSON.stringify(beBlocks));beBlocks=JSON.parse(beFuture.pop());beRender();beSync()}
function beUpload(kind,id){beTarget={kind,id};let f=document.getElementById('be-file');if(f){f.value='';f.click()}}
function beHandleFile(inp){let file=inp.files?.[0];if(!file)return;if(!/^image\/(jpeg|png|webp)$/.test(file.type))return alert('僅支援 JPG、PNG、WebP');if(file.size>15e6)return alert('請選擇 15MB 以下的圖片');let r=new FileReader();r.onload=()=>{let img=new Image();img.onload=()=>{let scale=Math.min(1,1200/img.width);let c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);let data=c.toDataURL('image/jpeg',.76);beSnapshot();let b=beTarget.id?beBlocks.find(x=>x.id===beTarget.id):null;if(!b){b={id:beUid(),kind:beTarget.kind,html:'',src:''};beBlocks.push(b)}b.src=data;beRender();beSync();toast('圖片已插入，請記得儲存文章')};img.onerror=()=>alert('圖片無法讀取');img.src=r.result};r.readAsDataURL(file)}
document.addEventListener('keydown',e=>{let a=document.activeElement;if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='a'&&a?.closest?.('#be-blocks'))e.stopPropagation();},true);


/* 招募預覽：先顯示信件填寫視窗，再由使用者選擇開啟預設郵件程式 */
function openRecruitCompose(){
 const email=(document.querySelector('#f_recruitEmail')?.value||'').trim();
 if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
   alert('請先在「招募聯絡人 Email」欄位填入有效的收件信箱，才能測試洽詢功能。');
   document.querySelector('#f_recruitEmail')?.focus();return;
 }
 document.getElementById('recruit-compose-overlay')?.remove();
 const overlay=document.createElement('div');overlay.id='recruit-compose-overlay';
 overlay.innerHTML=`<div class="recruit-compose-card" role="dialog" aria-modal="true" aria-label="招募洽詢信件">
 <div class="recruit-compose-head"><strong>洽詢招募資訊</strong><button type="button" aria-label="關閉" onclick="closeRecruitCompose()">✕</button></div>
 <label>收件人<input id="recruit-to" type="email" readonly></label>
 <label>主旨<input id="recruit-subject" type="text" value="添好運招募資訊洽詢"></label>
 <label>信件內容<textarea id="recruit-message" rows="6" placeholder="您好，我想詢問添好運的招募資訊……"></textarea></label>
 <p class="recruit-compose-note">此為 CMS 預覽：不會直接寄出郵件。按下「開啟郵件程式」後，會交由您裝置設定的郵件 App 處理；若瀏覽器沒有設定郵件程式，可先複製信件內容。</p>
 <div class="recruit-compose-actions"><button type="button" onclick="copyRecruitCompose()">複製信件內容</button><button type="button" class="recruit-compose-send" onclick="launchRecruitMail()">開啟郵件程式 ↗</button></div></div>`;
 overlay.addEventListener('mousedown',e=>{if(e.target===overlay)closeRecruitCompose()});
 document.body.appendChild(overlay);
 document.getElementById('recruit-to').value=email;
 document.getElementById('recruit-message').focus();
}
function closeRecruitCompose(){document.getElementById('recruit-compose-overlay')?.remove()}
function recruitMailData(){return {to:document.getElementById('recruit-to')?.value||'',subject:document.getElementById('recruit-subject')?.value||'',body:document.getElementById('recruit-message')?.value||''}}
function launchRecruitMail(){const d=recruitMailData();window.location.href='mailto:'+encodeURIComponent(d.to)+'?subject='+encodeURIComponent(d.subject)+'&body='+encodeURIComponent(d.body)}
async function copyRecruitCompose(){const d=recruitMailData(),v='收件人：'+d.to+'\n主旨：'+d.subject+'\n\n'+d.body;try{await navigator.clipboard.writeText(v);alert('信件內容已複製，可貼到 Gmail、Outlook 或其他郵件服務。')}catch(e){const t=document.createElement('textarea');t.value=v;document.body.appendChild(t);t.select();const ok=document.execCommand('copy');t.remove();alert(ok?'信件內容已複製。':'無法自動複製，請手動選取信件內容。')}}
</script></body></html>
